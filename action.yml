name: SecGuard repository scan
description: >-
  Scan a repository's dependencies (known vulnerabilities, licences,
  maintenance, typo-squatting, freshness) and code quality, publish SARIF
  to GitHub code scanning, review pull requests and optionally upload the
  report to a SecGuard server.
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: "."
  application-name:
    description: Name of the application in SecGuard (for example "Customer Portal"). Defaults to the repository name.
    default: ""
  server-url:
    description: SecGuard server URL. When set, the report is uploaded there.
    default: ""
  api-token:
    description: "SecGuard API token for uploads. Leave empty to authenticate with GitHub OIDC (needs `id-token: write`)."
    default: ""
  upload-sarif:
    description: "Publish results to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  review-pull-requests:
    description: "Post inline review comments and upgrade suggestions on pull requests (needs `pull-requests: write`)."
    default: "true"
  review-min-severity:
    description: Lowest severity that gets an inline pull-request comment.
    default: "medium"
  fail-on:
    description: Fail the job on findings at or above this severity (none, informational, low, medium, high, critical).
    default: "none"
  gate:
    description: On pull requests, also scan the base commit and fail when the change adds findings, lowers maintainability or newly misses an objective (true/false).
    default: "true"
  gate-new-severity:
    description: Pull-request gate - fail on new findings at or above this severity (none, informational, low, medium, high, critical).
    default: "high"
  gate-max-rating-drop:
    description: Pull-request gate - largest allowed maintainability drop, in stars.
    default: "0.2"
  objective-max-critical:
    description: Objective - critical findings at most. Empty switches it off.
    default: "0"
  objective-max-high:
    description: Objective - high findings at most. Empty switches it off.
    default: ""
  objective-min-maintainability:
    description: Objective - maintainability rating at least, in stars (0.5-5.5). Empty switches it off.
    default: ""
  objective-min-health:
    description: Objective - health score at least (0-100). Empty switches it off.
    default: ""
  github-token:
    description: Token for the pull-request review and upstream repository activity.
    default: ${{ github.token }}
  mendix:
    description: "Analyse the Mendix model of every Mendix project (.mpr) in the repository: downloads MxBuild and exports each model with `mx dump-mpr`."
    default: "true"
  mendix-version:
    description: Full Mendix version (for example 10.18.0.54340) used for every project's MxBuild download. Read from each .mpr file when empty.
    default: ""

outputs:
  report:
    description: Path of the JSON report.
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install SecGuard
      shell: bash
      run: python -m pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Export Mendix models
      id: mendix
      if: ${{ inputs.mendix == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        SECGUARD_MENDIX_VERSION: ${{ inputs.mendix-version }}
      run: |
        mapfile -t projects < <(python -m backend.repository mendix-projects .)
        if [ ${#projects[@]} -eq 0 ]; then exit 0; fi
        exports="$RUNNER_TEMP/secguard/mendix"
        mkdir -p "$exports"
        echo "model=$exports" >> "$GITHUB_OUTPUT"
        for project in "${projects[@]}"; do
          version="$SECGUARD_MENDIX_VERSION"
          if [ -z "$version" ]; then
            version=$(python -c 'import sqlite3, sys; print(sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True).execute("SELECT _ProductVersion FROM _MetaData").fetchone()[0])' "$project" 2>/dev/null || true)
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "::warning::Could not read the Mendix version of $project; set the mendix-version input."
            continue
          fi
          IFS=. read -r major minor _ <<< "$version"
          if (( major < 10 || (major == 10 && minor < 4) )); then
            echo "::warning::$project uses Mendix $version; mx dump-mpr needs Mendix 10.4 or later, so it was not analysed."
            continue
          fi
          tools="$RUNNER_TEMP/mxbuild-$version"
          if [ ! -x "$tools/modeler/mx" ]; then
            mkdir -p "$tools"
            if ! curl -fsSL "https://cdn.mendix.com/runtime/mxbuild-$version.tar.gz" | tar -xz -C "$tools"; then
              echo "::warning::Could not download MxBuild $version; $project was not analysed."
              continue
            fi
          fi
          mkdir -p "$exports/$(dirname "$project")"
          if ! "$tools/modeler/mx" dump-mpr "$project" > "$exports/$project.json"; then
            rm -f "$exports/$project.json"
            echo "::warning::mx dump-mpr failed for $project; it was not analysed."
          fi
        done

    - name: Scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SECGUARD_API_TOKEN: ${{ inputs.api-token }}
        SECGUARD_SERVER: ${{ inputs.server-url }}
        SECGUARD_FAIL_ON: ${{ inputs.fail-on }}
        SECGUARD_APPLICATION_NAME: ${{ inputs.application-name }}
        SECGUARD_MENDIX_MODEL: ${{ steps.mendix.outputs.model }}
      run: |
        out="$RUNNER_TEMP/secguard"
        mkdir -p "$out"
        args=(scan . --output "$out/report.json" --sarif "$out/secguard.sarif"
              --cyclonedx "$out/sbom.cdx.json" --spdx "$out/sbom.spdx.json"
              --fail-on "$SECGUARD_FAIL_ON")
        if [ -n "$SECGUARD_SERVER" ]; then args+=(--upload "$SECGUARD_SERVER"); fi
        set +e
        python -m backend.repository "${args[@]}"
        status=$?
        set -e
        echo "report=$out/report.json" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/secguard/secguard.sarif
        category: secguard

    - name: Review pull request
      if: ${{ always() && github.event_name == 'pull_request' && inputs.review-pull-requests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SECGUARD_REVIEW_MIN_SEVERITY: ${{ inputs.review-min-severity }}
      run: python -m backend.repository review --report "$RUNNER_TEMP/secguard/report.json" --root . --min-severity "$SECGUARD_REVIEW_MIN_SEVERITY"

    - name: Keep SBOM and report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: secguard-report
        path: ${{ runner.temp }}/secguard/

    - name: Scan the pull request's base
      id: base
      if: ${{ always() && steps.scan.outputs.report != '' && github.event_name == 'pull_request' && inputs.gate == 'true' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        tree="$RUNNER_TEMP/secguard-base"
        prefix="$(git rev-parse --show-prefix)"
        if ! git worktree add --detach "$tree" "$BASE_SHA" >/dev/null 2>&1; then
          echo "::warning::SecGuard gate skipped: base commit $BASE_SHA is not available. Use actions/checkout with fetch-depth: 0."
          exit 0
        fi
        python -m backend.repository scan "$tree/$prefix" --name "$GITHUB_REPOSITORY" --commit "$BASE_SHA" \
          --output "$RUNNER_TEMP/secguard-base.json"
        git worktree remove --force "$tree"
        echo "report=$RUNNER_TEMP/secguard-base.json" >> "$GITHUB_OUTPUT"

    - name: Pull-request gate
      if: ${{ always() && steps.base.outputs.report != '' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        BASELINE: ${{ steps.base.outputs.report }}
        GATE_NEW_SEVERITY: ${{ inputs.gate-new-severity }}
        GATE_MAX_RATING_DROP: ${{ inputs.gate-max-rating-drop }}
        OBJECTIVE_MAX_CRITICAL: ${{ inputs.objective-max-critical }}
        OBJECTIVE_MAX_HIGH: ${{ inputs.objective-max-high }}
        OBJECTIVE_MIN_MAINTAINABILITY: ${{ inputs.objective-min-maintainability }}
        OBJECTIVE_MIN_HEALTH: ${{ inputs.objective-min-health }}
      run: |
        python -m backend.repository gate --report "$RUNNER_TEMP/secguard/report.json" --baseline "$BASELINE" \
          --new-severity "$GATE_NEW_SEVERITY" --max-rating-drop "$GATE_MAX_RATING_DROP" \
          --max-critical "$OBJECTIVE_MAX_CRITICAL" --max-high "$OBJECTIVE_MAX_HIGH" \
          --min-maintainability "$OBJECTIVE_MIN_MAINTAINABILITY" --min-health "$OBJECTIVE_MIN_HEALTH"

    - name: Apply fail-on threshold
      if: ${{ steps.scan.outputs.status != '0' }}
      shell: bash
      run: exit 1
