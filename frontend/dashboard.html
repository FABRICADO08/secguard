<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dashboard - Application Security Platform
    </title>

    <link
        rel="stylesheet"
        href="/css/main.css"
    >

</head>

<body>

<header class="header">

    <div>

        <div class="eyebrow">
            APPLICATION SECURITY PLATFORM
        </div>

        <h1>
            Dashboard
        </h1>

        <p>
            Every application that has been discovered and
            analyzed, ranked by risk.
        </p>

    </div>

    <nav class="nav">

        <a href="/index.html">
            Discovery
        </a>

        <a
            class="active"
            href="/dashboard.html"
        >
            Dashboard
        </a>

        <a href="/findings.html">
            Findings
        </a>

    </nav>

</header>


<main class="container">

    <section class="card">

        <div class="metrics">

            <div class="metric">

                <strong id="applicationCount">
                    0
                </strong>

                <span>
                    Applications
                </span>

            </div>

            <div class="metric">

                <strong id="findingTotal">
                    0
                </strong>

                <span>
                    Findings
                </span>

            </div>

            <div class="metric">

                <strong id="highestRisk">
                    0
                </strong>

                <span>
                    Highest Risk Score
                </span>

            </div>

            <div class="metric">

                <strong id="criticalTotal">
                    0
                </strong>

                <span>
                    Critical + High
                </span>

            </div>

        </div>

    </section>


    <section class="card">

        <h2>
            Applications
        </h2>

        <div
            id="applications"
            class="application-list"
        ></div>

    </section>

</main>


<script
    src="/js/common.js"
></script>

<script
    src="/js/dashboard.js"
></script>

</body>

</html>
